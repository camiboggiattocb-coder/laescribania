        <div class="field" style="margin-bottom:12px"><label>Financiación</label>
          <div class="checkbox-grid" style="grid-template-columns:1fr 1fr">
            <label><input type="checkbox" id="f_aptaCredito" ${ck('aptaCredito')}> Apta crédito hipotecario</label>
            <label><input type="checkbox" id="f_aceptaFinanciacion" ${ck('aceptaFinanciacion')} onchange="Prop.toggleFin()"> Acepta financiación</label>
          </div>
        </div>
        <div class="form-row one" id="sec_fin">
          <div class="field"><label>Detalle de la financiación</label>
            <textarea id="f_tipoFinanciacion" rows="2" placeholder="Ej: 50% al boleto y saldo en 12 cuotas; acepta permuta por auto; etc.">${esc(v('tipoFinanciacion'))}</textarea>
            <div class="hint">Texto libre: describí cómo se financia esta propiedad.</div>
          </div>
        </div>
      </div>
    `, `<button class="btn" onclick="Modal.close()">Cancelar</button><button class="btn btn-primary" onclick="Prop.save(${id||'null'})">${id?'Guardar cambios':'Crear propiedad'}</button>`);

    // estado inicial de los bloques condicionales
    Prop.toggleTipo(); Prop.toggleVisor(); Prop.toggleFin(); Prop.calcComision();
    // cargar unidades adicionales ya guardadas (si es edición)
    Prop._unidadSeq = 0;
    const existentes = (id ? (prop(id).unidades||[]) : []);
    existentes.forEach(u => Prop.agregarUnidad(u));
  },

  /* ----- Unidades adicionales (para ventas de varias unidades juntas) ----- */
  agregarUnidad(datos){
    const cont = document.getElementById('unidades_container');
    if (!cont) return;
    const i = ++Prop._unidadSeq;
    const d = datos || {};
    const opt = (arr,cur) => arr.map(o=>`<option ${cur===o?'selected':''}>${o}</option>`).join("");
    const div = document.createElement('div');
    div.className = 'unidad-box';
    div.id = 'unidad_'+i;
    div.style.cssText = 'border:1px solid var(--line-strong);border-radius:8px;padding:14px;margin-bottom:12px;background:var(--surface)';
    div.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <span style="font-weight:700;color:var(--brand);font-size:13px">Unidad adicional</span>
        <button type="button" class="icon-btn" title="Quitar" onclick="Prop.quitarUnidad(${i})">${I.trash}</button>
      </div>
      <div class="form-row">
        <div class="field"><label>Tipo</label><select class="u_tipo" data-u="${i}">
          ${opt(["Casa","Departamento","Local","Terreno","Galpón","Oficina","Campo","Cochera","Baulera"], d.tipo)}
        </select></div>
        <div class="field"><label>Sup. cubierta (m²)</label><input class="u_supCub" data-u="${i}" type="number" value="${esc(d.supCub||"")}"></div>
      </div>
      <div class="form-row">
        <div class="field"><label>Ambientes</label><input class="u_ambientes" data-u="${i}" type="number" value="${esc(d.ambientes||"")}"></div>
        <div class="field"><label>Dormitorios</label><input class="u_dorm" data-u="${i}" type="number" value="${esc(d.dorm||"")}"></div>
      </div>
      <div class="form-row">
        <div class="field"><label>Baños</label><input class="u_banos" data-u="${i}" type="number" value="${esc(d.banos||"")}"></div>
        <div class="field"><label>Estado / detalle</label><input class="u_detalle" data-u="${i}" value="${esc(d.detalle||"")}" placeholder="Ej: en muy buen estado, alquilado, etc."></div>
      </div>`;
    cont.appendChild(div);
  },

  quitarUnidad(i){
    const div = document.getElementById('unidad_'+i);
    if (div) div.remove();
  },

  leerUnidades(){
    const boxes = document.querySelectorAll('.unidad-box');
    const out = [];
    boxes.forEach(b=>{
      const q = sel => b.querySelector(sel);
      const numOrNull = el => { const n=parseFloat(el.value); return isNaN(n)?null:n; };
      out.push({
        tipo: q('.u_tipo').value,
        supCub: numOrNull(q('.u_supCub')),
        ambientes: numOrNull(q('.u_ambientes')),
        dorm: numOrNull(q('.u_dorm')),
        banos: numOrNull(q('.u_banos')),
        detalle: q('.u_detalle').value || ""
      });
    });
    return out;
  },

  toggleTipo(){
    const t = document.getElementById('f_tipo').value;
    document.getElementById('sec_vivienda').style.display = isVivienda(t) ? "" : "none";
    const sc = document.getElementById('sec_campo');
    if (sc) sc.style.display = (t==="Campo") ? "" : "none";
    // Campos generales que no aplican a Campo ni Terreno
    const esCampo = (t==="Campo"), esTerreno = (t==="Terreno");
    const supCub = document.getElementById('fld_supCub');
    const supTot = document.getElementById('fld_supTot');
    const anioEstado = document.getElementById('row_anioEstado');
    // Sup. cubierta: no va en Campo ni Terreno
    if (supCub) supCub.style.display = (esCampo||esTerreno) ? "none" : "";
    // Sup. total: no va en Campo; en Terreno SÍ va (se mide en m²)
    if (supTot) supTot.style.display = esCampo ? "none" : "";
    // Año y estado: no van en Campo ni Terreno
    if (anioEstado) anioEstado.style.display = (esCampo||esTerreno) ? "none" : "";
  },
  calcComision(){
    const precio = parseFloat(document.getElementById('f_valorVenta')?.value)||0;
    const pct = parseFloat(document.getElementById('f_comision')?.value)||0;
    const mon = document.getElementById('f_monedaVenta')?.value||"USD";
    const out = document.getElementById('f_comisionCalc');
    if (out) out.value = (precio>0 && pct>0) ? fmt(Math.round(precio*pct/100), mon) : "—";
  },
  eliminar(id){
    if (!canDelete()) { alert("Tu perfil no tiene permiso para eliminar propiedades."); return; }
    const p = prop(id);
    const msg = `¿Eliminar la propiedad ${p.codigo} — "${p.titulo}"? Esta acción no se puede deshacer.`;
    if (!confirm(msg)) return;
    // borrar en la nube (propiedad y sus interesados)
    DB.leads.filter(l=>l.propId===id).forEach(l=>persistDelete('leads', l.id));
    persistDelete('properties', id);
    DB.properties = DB.properties.filter(x=>x.id!==id);
    DB.leads = DB.leads.filter(l=>l.propId!==id);
    App.go(STATE.page);
  },
  /* --- Cierre de venta: registra el precio REAL de cierre y la comisión --- */
  marcarVendida(id){
    const p = prop(id);
    if (!can()) { alert("Tu perfil no puede registrar ventas."); return; }
    Prop._ventaProp = p; // referencia para calcular la diferencia de precio
    const comSug = p.comision || 3;
    Modal.open(`Registrar venta — ${esc(p.titulo)}`, `
      <div class="notice" style="margin-bottom:16px">${I.info}<div>
        Cargá los datos reales del cierre. El precio de publicación era
        <b>${fmt(p.valorVenta, p.monedaVenta)}</b> — si se cerró por otro monto, poné el real acá.
      </div></div>

      <div class="form-section" style="margin-top:0">
        <h4>${I.money} Precio de cierre</h4>
        <div class="form-row">
          <div class="field"><label>Precio real de venta</label>
            <input id="v_precio" type="text" inputmode="numeric" value="${p.valorVenta||""}"
                   oninput="Prop.calcVenta()" style="font-size:17px;font-weight:600">
          </div>
          <div class="field"><label>Moneda</label>
            <select id="v_moneda" onchange="Prop.calcVenta()">
              <option ${p.monedaVenta==="USD"?"selected":""}>USD</option>
              <option ${p.monedaVenta==="ARS"?"selected":""}>ARS</option>
            </select>
          </div>
        </div>
        <div id="v_dif" class="hint" style="margin-top:-4px"></div>
      </div>

      <div class="form-section">
        <h4>${I.sale} Comisión</h4>
        <div class="form-row">
          <div class="field"><label>Comisión (%)</label>
            <input id="v_comision" type="text" inputmode="decimal" value="${comSug}" oninput="Prop.calcVenta()">
            <div class="hint">Se recalcula sola sobre el precio de cierre.</div>
          </div>
          <div class="field"><label>Monto de comisión</label>
            <input id="v_comMonto" type="text" inputmode="numeric" oninput="Prop.calcVenta('monto')">
            <div class="hint">Si lo cargás a mano, se ajusta el porcentaje.</div>
          </div>
        </div>
      </div>

      <div class="form-section">
        <h4>${I.cal} Datos de la operación</h4>
        <div class="form-row">
          <div class="field"><label>Fecha de la venta</label>
            <input id="v_fecha" type="date" value="${today}"></div>
          <div class="field"><label>Vendedor (quién la vendió)</label>
            <input id="v_vendedor" value="${esc(p.captador||"")}" list="lista_vendedores" placeholder="Nombre de quien la vendió">
            <datalist id="lista_vendedores">${vendedoresUsados().concat(captadoresUsados()).filter((x,i,a)=>a.indexOf(x)===i).map(vd=>`<option value="${esc(vd)}">`).join("")}</datalist>
            <div class="hint">Sugerimos el captador, pero podés cambiarlo si la vendió otra persona.</div></div>
        </div>
        <div class="form-row">
          <div class="field"><label>Comprador (opcional)</label>
            <input id="v_comprador" placeholder="Nombre del comprador"></div>
          <div class="field"></div>
        </div>
        <div class="form-row one"><div class="field">
          <label>Notas del cierre (opcional)</label>
          <textarea id="v_nota" rows="2" placeholder="Ej: se cerró con financiación, escritura en 60 días, etc."></textarea>
        </div></div>
      </div>
    `, `<button class="btn" onclick="Modal.close()">Cancelar</button>
        <button class="btn btn-primary" onclick="Prop.guardarVenta(${id})">${I.check} Confirmar venta</button>`);
    setTimeout(()=>Prop.calcVenta(),50);
  },

  // Recalcula comisión <-> monto en el formulario de venta.
  // origen='monto' significa que el usuario escribió el monto a mano.
  calcVenta(origen){
    const gv = k => (document.getElementById(k)?.value||"").replace(/[^\d.,]/g,"").replace(",",".");
    const precio = parseFloat(gv('v_precio'))||0;
    const moneda = document.getElementById('v_moneda')?.value||"USD";
    const elPct = document.getElementById('v_comision');
    const elMonto = document.getElementById('v_comMonto');
    if (!elPct||!elMonto) return;

    if (origen==='monto') {
      const monto = parseFloat(gv('v_comMonto'))||0;
      elPct.value = precio ? (monto*100/precio).toFixed(2).replace(/\.00$/,"") : "";
    } else {
      const pct = parseFloat(gv('v_comision'))||0;
      elMonto.value = precio ? Math.round(precio*pct/100) : "";
    }

    // Diferencia contra el precio publicado
    const dif = document.getElementById('v_dif');
    const p = Prop._ventaProp;
    if (dif && p && p.valorVenta && precio && moneda===p.monedaVenta) {
      const d = precio - p.valorVenta;
      const pct = Math.round(Math.abs(d)*100/p.valorVenta);
      dif.innerHTML = d===0
        ? `Cerró al precio de publicación.`
        : (d<0
          ? `<span style="color:var(--red);font-weight:600">${fmt(Math.abs(d),moneda)} por debajo</span> del precio publicado (−${pct}%).`
          : `<span style="color:var(--green);font-weight:600">${fmt(d,moneda)} por encima</span> del precio publicado (+${pct}%).`);
    } else if (dif) { dif.innerHTML = ""; }
  },

  guardarVenta(id){
    const p = prop(id);
    const gv = k => (document.getElementById(k).value||"").replace(/[^\d.,]/g,"").replace(",",".");
    const precio = parseFloat(gv('v_precio'));
    const pct = parseFloat(gv('v_comision'));
    const monto = parseFloat(gv('v_comMonto'));
    const fecha = document.getElementById('v_fecha').value;

    if (!precio || precio<=0) { alert("Cargá el precio real de venta."); return; }
    if (!fecha) { alert("Cargá la fecha de la venta."); return; }

    // Guardamos el precio de publicación antes de pisarlo, para poder comparar
    p.precioPublicado = p.precioPublicado!=null ? p.precioPublicado : p.valorVenta;
    p.monedaPublicada = p.monedaPublicada || p.monedaVenta;

    p.estadoOp = "Vendida";
    p.precioVenta = precio;                                   // precio REAL de cierre
    p.monedaVentaReal = document.getElementById('v_moneda').value;
    p.comision = isNaN(pct) ? p.comision : pct;
    p.comisionMonto = isNaN(monto) ? Math.round(precio*(pct||0)/100) : monto;
    p.fechaVenta = fecha;
    p.comprador = document.getElementById('v_comprador').value||"";
    p.vendedor = document.getElementById('v_vendedor').value||"";
    p.notaVenta = document.getElementById('v_nota').value||"";

    persist('properties', p);
    Modal.close();
    App.go(STATE.page);
  },
  toggleFin(){
    const cb = document.getElementById('f_aceptaFinanciacion');
    const sec = document.getElementById('sec_fin');
    if (cb && sec) sec.style.display = cb.checked ? "" : "none";
  },
  toggleVisor(){
    const cb = document.getElementById('f_visible');
    const sec = document.getElementById('sec_visor');
    if (cb && sec) sec.style.display = cb.checked ? "" : "none";
  },

  save(id){
    const g = k => { const el=document.getElementById('f_'+k); return el?el.value:""; };
    const gc = k => { const el=document.getElementById('f_'+k); return el?el.checked:false; };
    const num = k => { const x=parseFloat(g(k)); return isNaN(x)?null:x; };
    const tipo = g('tipo');
    const enVenta = true; // este sistema gestiona solo ventas
    const servicios = Array.from(document.querySelectorAll('.f_serv:checked')).map(e=>e.value);

    const esCampo = (tipo==="Campo"), esTerreno = (tipo==="Terreno");
    const data = {
      titulo:g('titulo'), tipo, localidad:g('localidad'), barrio:g('barrio'), direccion:g('direccion'),
      observaciones:g('observaciones'),
      supCub: (esCampo||esTerreno) ? null : num('supCub'),
      supTot: esCampo ? null : num('supTot'),
      anio: (esCampo||esTerreno) ? null : num('anio'),
      estado: (esCampo||esTerreno) ? "" : g('estado'),
      servicios, unidades: Prop.leerUnidades(), drive:g('drive'), visibleColegas:gc('visible'),
      visorCampos: (function(){
        const keys=["valor","superficie","ambientes","anio","estado","servicios","financiacion"];
        const sel=Array.from(document.querySelectorAll('.f_visorcampo:checked')).map(e=>e.value);
        const obj={}; keys.forEach(k=>obj[k]=sel.includes(k)); return obj;
      })(),
      enVenta,
    };
    if (isVivienda(tipo)) {
      Object.assign(data, {
        ambientes:num('ambientes'), dorm:num('dorm'), banos:num('banos'), cochera:g('cochera'),
        patio:gc('patio'), living:gc('living'), cocina:gc('cocina'), lavadero:gc('lavadero'),
        balcon:gc('balcon'), amoblado:gc('amoblado'),
      });
    }
    if (tipo==="Campo") {
      Object.assign(data, {
        tipoSuelo:g('tipoSuelo'), hectareas:num('hectareas'), actividad:g('actividad'),
        edificacion: g('edificacion')==="1", obsCampo:g('obsCampo'), formaVenta:g('formaVenta'),
      });
    }
    if (enVenta) Object.assign(data, {
      valorVenta:num('valorVenta'), monedaVenta:g('monedaVenta'), obsPrecio:g('obsPrecio'), propietario:g('propietario'),
      telPropietario:g('telPropietario'),
      captador:g('captador'),
      escritura:g('escritura'),
      comision:num('comision'), estadoOp:g('estadoOp'), fechaPub:g('fechaPub'),
      aptaCredito:gc('aptaCredito'), aceptaFinanciacion:gc('aceptaFinanciacion'),
      tipoFinanciacion: gc('aceptaFinanciacion') ? g('tipoFinanciacion') : "",
    });
    if (!data.titulo) { alert("Poné al menos un título para la propiedad."); return; }

    if (id) {
      const ex = prop(id);
      // historial de precios de venta: registrar si cambió el valor
      let hist = ex.histPrecios || [];
      if (enVenta && data.valorVenta!=null && (ex.valorVenta!==data.valorVenta || ex.monedaVenta!==data.monedaVenta)) {
        hist = hist.concat([{ fecha:today, valor:data.valorVenta, moneda:data.monedaVenta }]);
      }
      data.histPrecios = hist;
      Object.assign(ex, data);
      persist('properties', ex);
    } else {
      data.id = DB.nextId.properties++;
      data.codigo = "PROP-" + String(DB.nextCodigo++).padStart(4,"0");
      if (enVenta && data.valorVenta!=null) data.histPrecios = [{ fecha:data.fechaPub||today, valor:data.valorVenta, moneda:data.monedaVenta }];
      DB.properties.push(data);
      persist('properties', data);
      persistMeta();
    }
    Modal.close();
    App.go(STATE.page);
    if (!id) setTimeout(()=>alert(`Propiedad creada con código ${data.codigo}.\nUsá este código para nombrar la carpeta en Drive y encontrarla rápido.`),100);
  },

  view(id){
    const p = prop(id);
    const isViewer = STATE.role==="viewer";
    const ve = k => !isViewer || App.visorVe(p,k); // admin ve todo; visor según config
    const item = (k,val)=>`<div class="detail-item"><div class="k">${k}</div><div class="v">${val}</div></div>`;
    let g = [];
    if (!isViewer) g.push(item("Código", `<span class="code-tag">${esc(p.codigo||"—")}</span>`));
    g.push(item("Tipo",esc(p.tipo)));
    g.push(item("Localidad",esc(p.localidad)));
    if (p.barrio) g.push(item("Barrio",esc(p.barrio)));
    if (!isViewer) g.push(item("Dirección",esc(p.direccion)));   // dirección exacta nunca al visor
    if (ve('superficie')) g.push(item("Superficie",`${p.supCub||"—"} m² cub. / ${p.supTot||"—"} m² terreno`));
    if (ve('anio')) g.push(item("Año",p.anio||"—"));
    if (ve('estado')) g.push(item("Estado",esc(p.estado||"—")));
    if (isVivienda(p.tipo) && ve('ambientes')) {
      g.push(item("Ambientes",p.ambientes??"—"));
      g.push(item("Dormitorios",p.dorm??"—"));
      g.push(item("Baños",p.banos??"—"));
      g.push(item("Cochera",esc(p.cochera||"—")));
    }
    if (isVivienda(p.tipo)) {
      const comod = [p.patio&&"Patio/jardín",p.living&&"Living",p.cocina&&"Cocina",p.lavadero&&"Lavadero",p.balcon&&"Balcón",p.amoblado&&"Amoblado"].filter(Boolean).join(", ")||"—";
      g.push(item("Comodidades",comod));
    }
    if (p.tipo==="Campo") {
      g.push(item("Tipo de suelo",esc(p.tipoSuelo||"—")));
      g.push(item("Hectáreas",p.hectareas??"—"));
      g.push(item("Actividad",esc(p.actividad||"—")));
      g.push(item("Edificación",p.edificacion?"Sí":"No"));
    }
    let html = `<div class="detail-grid">${g.join("")}</div>`;
    if (p.tipo==="Campo") {
      if (p.obsCampo) html += `<div class="section"><div class="detail-item"><div class="k">Observaciones del campo</div><div class="v">${esc(p.obsCampo)}</div></div></div>`;
      if (p.formaVenta && !isViewer) html += `<div class="section"><div class="detail-item"><div class="k">Forma de venta</div><div class="v">${esc(p.formaVenta)}</div></div></div>`;
    }
    if ((p.servicios||[]).length && ve('servicios')) html += `<div class="section"><div class="detail-item"><div class="k">Servicios</div><div class="v">${p.servicios.map(s=>esc(s)).join(" · ")}</div></div></div>`;

    if (p.enVenta) {
      const ventaItems = [];
      if (ve('valor')) {
        ventaItems.push(item("Valor", fmt(p.valorVenta,p.monedaVenta) + (p.obsPrecio?`<div class="t-muted" style="font-weight:400">${esc(p.obsPrecio)}</div>`:"")));
      } else if (isViewer) ventaItems.push(item("Valor", '<span class="t-muted">A consultar</span>'));
      if (!isViewer) ventaItems.push(item("Propietario",esc(p.propietario||"—") + (p.telPropietario?`<div class="t-muted" style="font-weight:400">${esc(p.telPropietario)}</div>`:"")));
      if (!isViewer) {
        const comMonto = (p.comision && p.valorVenta) ? fmt(Math.round(p.valorVenta*p.comision/100), p.monedaVenta) : null;
        ventaItems.push(item("Comisión",(p.comision||"—")+"%" + (comMonto?`<div class="t-muted" style="font-weight:400">≈ ${comMonto}</div>`:"")));
      }
      ventaItems.push(item("Estado", esVendida(p)?'<span class="badge red"><span class="dot"></span>Vendida</span>':App.opBadge(p.estadoOp)));
      if (p.escritura) ventaItems.push(item("Escritura", esc(p.escritura)));
      if (!isViewer && p.captador) ventaItems.push(item("Captador", esc(p.captador)));
      if (ve('financiacion')) {
        ventaItems.push(item("Apta crédito", p.aptaCredito?'<span class="badge green"><span class="dot"></span>Sí</span>':'<span class="badge gray">No</span>'));
        ventaItems.push(item("Acepta financiación", p.aceptaFinanciacion?'<span class="badge green"><span class="dot"></span>Sí</span>':'<span class="badge gray">No</span>'));
      }
      html += `<div class="section"><div class="section-head"><h3>Venta</h3></div><div class="detail-grid">
        ${ventaItems.join("")}</div>
        ${(ve('financiacion') && p.aceptaFinanciacion && p.tipoFinanciacion)?`<div class="detail-item" style="margin-top:14px"><div class="k">Detalle de financiación</div><div class="v">${esc(p.tipoFinanciacion)}</div></div>`:""}
        ${(!isViewer && p.histPrecios && p.histPrecios.length>1)?`<div style="margin-top:14px"><div class="k" style="font-size:11.5px;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin-bottom:8px">Historial de precios</div><ul class="timeline">${p.histPrecios.slice().reverse().map(h=>`<li>${fdate(h.fecha)} — ${fmt(h.valor,h.moneda)}</li>`).join("")}</ul></div>`:""}
      </div>`;
    }
    // Datos del cierre de venta (no lo ve el colega)
    if (!isViewer && esVendida(p) && p.precioVenta!=null) {
      const mReal = p.monedaVentaReal||p.monedaVenta;
      const tuvo = p.precioPublicado!=null && p.precioPublicado>0 && (p.monedaPublicada||p.monedaVenta)===mReal;
      const d = tuvo ? p.precioVenta-p.precioPublicado : null;
      const dp = tuvo && p.precioPublicado ? Math.round(d*100/p.precioPublicado) : null;
      const dias = (p.fechaPub&&p.fechaVenta)?daysBetween(p.fechaPub,p.fechaVenta):null;
      html += `<div class="section"><div class="section-head"><h3>Venta cerrada</h3></div>
        <div class="detail-grid">

          ${dp!=null?item("Diferencia",`<span style="color:${dp<0?'var(--red)':(dp>0?'var(--green)':'var(--ink)')};font-weight:600">${dp>0?'+':''}${dp}% (${fmt(Math.abs(d),mReal)})</span>`):""}
          ${item("Comisión",`${p.comisionMonto!=null?fmt(p.comisionMonto,mReal):"—"}${p.comision?` (${p.comision}%)`:""}`)}
          ${dias!=null?item("Tiempo hasta vender",`${dias} días`):""}
          ${p.comprador?item("Comprador",esc(p.comprador)):""}

        ${p.notaVenta?`<div class="card" style="padding:12px 14px;margin-top:10px"><div style="font-size:13.5px;white-space:pre-wrap">${esc(p.notaVenta)}</div></div>`:""}

        <div class="hint" style="margin-bottom:10px">Esta operación incluye ${p.unidades.length+1} unidades que se venden en conjunto.</div>
        <div class="table-wrap"><table>
          <thead><tr><th>Unidad</th><th>Tipo</th><th>Sup. cub.</th><th>Amb.</th><th>Dorm.</th><th>Baños</th><th>Detalle</th></tr></thead>
          <tbody>
            <tr><td class="t-strong">Principal</td><td>${esc(p.tipo)}</td><td>${p.supCub||"—"} m²</td><td>${p.ambientes||"—"}</td><td>${p.dorm||"—"}</td><td>${p.banos||"—"}</td><td class="t-muted">${esc(p.estado||"—")}</td></tr>
            ${p.unidades.map((u,idx)=>`<tr><td class="t-strong">Unidad ${idx+2}</td><td>${esc(u.tipo||"—")}</td><td>${u.supCub||"—"} m²</td><td>${u.ambientes||"—"}</td><td>${u.dorm||"—"}</td><td>${u.banos||"—"}</td><td class="t-muted">${esc(u.detalle||"—")}</td></tr>`).join("")}
          </tbody>
        </table></div>
      </div>`;
    }
    // Observaciones: solo uso interno, el colega no las ve
    if (!isViewer && p.observaciones) {
      html += `<div class="section"><div class="section-head"><h3>Observaciones</h3></div>
        <div class="card" style="padding:14px 16px"><div style="font-size:14px;line-height:1.6;white-space:pre-wrap">${esc(p.observaciones)}</div></div></div>`;

      <button class="btn" onclick="Prop.descargarPDF(${p.id})">${I.download} Descargar ficha PDF</button>
    </div>`;
    Modal.open(p.titulo, html);
  },

  /* ----- Ficha de la propiedad en PDF (sin precio, con financiación) ----- */
  descargarPDF(id){
    const p = prop(id);
    if (!window.jspdf || !window.jspdf.jsPDF) { alert("No se pudo cargar el generador de PDF. Verificá la conexión a internet e intentá de nuevo."); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:"mm", format:"a4" });
    const W = 210, M = 18;
    let y = 16;

    // Colores de marca
    const azul = [31,78,107], gris=[90,100,110], verde=[31,78,61], linea=[210,218,224];

    // --- Encabezado con logo ---
    try {
      const img = document.querySelector('#loginLogo, .brand-logo img, img[src^="data:image/jpeg"]');
      if (img && img.src) doc.addImage(img.src, "JPEG", M, y-2, 20, 22);
    } catch(e){}
    doc.setFont("helvetica","bold"); doc.setFontSize(17); doc.setTextColor(...azul);
    doc.text("INMOBILIARIA LA ESCRIBANÍA", M+25, y+6);
    doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...gris);
    doc.text("Marconi 7 — Morteros, Córdoba", M+25, y+12);
    y += 26;
    doc.setDrawColor(...verde); doc.setLineWidth(0.8); doc.line(M, y, W-M, y);
    y += 10;

    // --- Título de la propiedad ---
    doc.setFont("helvetica","bold"); doc.setFontSize(15); doc.setTextColor(40,45,50);
    const titLines = doc.splitTextToSize(p.titulo||"Propiedad", W-2*M);
    doc.text(titLines, M, y); y += titLines.length*7 + 1;
    doc.setFont("helvetica","normal"); doc.setFontSize(10.5); doc.setTextColor(...gris);
    const ubic = [p.barrio?("B° "+p.barrio):"", p.localidad].filter(Boolean).join(" — ");
    if (ubic){ doc.text(ubic, M, y); y += 6; }
    doc.setFontSize(9); doc.setTextColor(150,150,150);
    doc.text("Código: "+(p.codigo||"—")+"   ·   Tipo: "+(p.tipo||"—"), M, y); y += 9;

    // --- Helper de secciones ---
    const seccion = (titulo) => {
      if (y > 265){ doc.addPage(); y = 20; }
      doc.setFillColor(...azul); doc.rect(M, y-4, W-2*M, 7, "F");
      doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(255,255,255);
      doc.text(titulo.toUpperCase(), M+3, y+1); y += 9;
      doc.setTextColor(40,45,50);
    };
    const fila = (etq, val) => {
      if (val==null || val==="" || val==="—") return;
      if (y > 275){ doc.addPage(); y = 20; }
      doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor(...azul);
      doc.text(etq+":", M+2, y);
      doc.setFont("helvetica","normal"); doc.setTextColor(45,50,55);
      const vLines = doc.splitTextToSize(String(val), W-2*M-40);
      doc.text(vLines, M+42, y); y += Math.max(vLines.length*5, 5.5);
    };

    // --- Características ---
    seccion("Características");
    fila("Tipo", p.tipo);
    if (p.supCub) fila("Sup. cubierta", p.supCub+" m²");
    if (p.supTot) fila("Sup. del terreno", p.supTot+" m²");
    if (p.ambientes) fila("Ambientes", p.ambientes);
    if (p.dorm) fila("Dormitorios", p.dorm);
    if (p.banos) fila("Baños", p.banos);
    if (p.cochera && p.cochera!=="No tiene") fila("Cochera", p.cochera);
    if (p.anio) fila("Año / antigüedad", p.anio);
    if (p.estado) fila("Estado", p.estado);
    const comod = [p.patio&&"Patio/jardín",p.living&&"Living-comedor",p.cocina&&"Cocina",p.lavadero&&"Lavadero",p.balcon&&"Balcón",p.amoblado&&"Amoblado"].filter(Boolean);
    if (comod.length) fila("Comodidades", comod.join(", "));
    y += 2;

    // --- Unidades adicionales ---
    if (p.unidades && p.unidades.length){
      seccion("Unidades incluidas en la venta");
      doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(45,50,55);
      const desc = u => [u.tipo, u.supCub?u.supCub+" m²":"", u.dorm?u.dorm+" dorm.":"", u.banos?u.banos+" baños":"", u.detalle].filter(Boolean).join(" · ");
      doc.text("• Principal: "+desc({tipo:p.tipo,supCub:p.supCub,dorm:p.dorm,banos:p.banos,detalle:p.estado}), M+2, y, {maxWidth:W-2*M-4}); y += 6;
      p.unidades.forEach((u,i)=>{ if(y>275){doc.addPage();y=20;} doc.text("• Unidad "+(i+2)+": "+desc(u), M+2, y, {maxWidth:W-2*M-4}); y += 6; });
      y += 2;
    }

    // --- Servicios ---
    if (p.servicios && p.servicios.length){
      seccion("Servicios");
      doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(45,50,55);
      const sLines = doc.splitTextToSize(p.servicios.join("   ·   "), W-2*M-4);
      doc.text(sLines, M+2, y); y += sLines.length*5 + 3;
    }

    // --- Financiación (SÍ va) ---
    seccion("Financiación");
    fila("Apta crédito hipotecario", p.aptaCredito ? "Sí" : "No");
    fila("Acepta financiación", p.aceptaFinanciacion ? "Sí" : "No");
    if (p.escritura) fila("Situación", p.escritura);
    y += 4;

    // --- Pie ---
    const ph = doc.internal.pageSize.getHeight();
    doc.setDrawColor(...linea); doc.setLineWidth(0.3); doc.line(M, ph-18, W-M, ph-18);
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(140,140,140);
    doc.text("Inmobiliaria La Escribanía · Marconi 7, Morteros, Córdoba · Consultar precio y disponibilidad", M, ph-12);
    doc.text("Ficha generada el "+fdate(today), M, ph-8);

    const nombre = "Ficha_"+((p.codigo||"propiedad").replace(/[^\w-]/g,"_"))+".pdf";
    doc.save(nombre);
  },
};

const Cotiz = {
  form(){
    if (!can()) { alert("Tu perfil no puede modificar la cotización."); return; }
    Modal.open("Cotización del dólar", `
      <div class="notice" style="margin-bottom:16px">${I.info}<div>
        Este valor se usa para pasar a dólares las propiedades cargadas en pesos y poder
        comparar toda la cartera junta. <b>No modifica el precio de ninguna propiedad</b>:
        cada una conserva el valor y la moneda con que fue cargada.
      </div></div>
      <div class="form-row one"><div class="field">
        <label>¿A cuánto está el dólar? (1 USD en pesos)</label>
        <input id="c_valor" type="text" inputmode="numeric" value="${esc(DB.cotizacion||"")}" placeholder="Ej: 1450"
               style="font-size:20px;font-weight:700;padding:12px">
        <div class="hint">Poné el valor de referencia que manejen en la inmobiliaria.</div>
      </div></div>
      ${DB.cotizacionFecha?`<div class="t-muted" style="font-size:12.5px">Última actualización: ${fdate(DB.cotizacionFecha)}</div>`:""}
    `, `<button class="btn" onclick="Modal.close()">Cancelar</button>
        <button class="btn btn-primary" onclick="Cotiz.guardar()">${I.check} Guardar cotización</button>`);
  },

  guardar(){
    const raw = (document.getElementById('c_valor').value||"").replace(/[^\d]/g,"");
    const val = parseInt(raw);
    if (!val || val <= 0) { alert("Poné un valor válido para el dólar (solo números)."); return; }
    DB.cotizacion = val;
    DB.cotizacionFecha = today;
    persistMeta();
    Modal.close();
    App.go(STATE.page);
  },

  // Aviso si la cotización quedó vieja (más de 30 días sin tocar)
  desactualizada(){
    if (!DB.cotizacionFecha) return true;
    return daysBetween(DB.cotizacionFecha, today) > 30;
  }
};

const Lead = {

      const dd = l.proxima ? daysBetween(today, l.proxima) : null;

          Último contacto: ${fdate(l.fecha)}
          ${l.proxima?` · Próxima acción: <b style="color:${dd<0?'var(--red)':'var(--ink)'}">${fdate(l.proxima)}</b>${dd<0?` (atrasada ${-dd} ${-dd===1?'día':'días'})`:(dd===0?" (hoy)":"")}`:` · <span class="t-muted">sin próxima acción agendada</span>`}
        </div>
        ${(pendiente && can())?`<button class="btn btn-sm btn-primary" style="margin-top:10px" onclick="Lead.realizar(${l.id})">${I.check} Marcar seguimiento realizado</button>`:""}
        ${(l.historial && l.historial.length)?`
          <div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px">
            <div style="font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);font-weight:600;margin-bottom:7px">Historial de seguimientos</div>
            ${l.historial.slice(0,5).map(hh=>`
              <div style="display:flex;gap:8px;font-size:12.5px;padding:4px 0">
                <span class="t-muted" style="flex:0 0 82px">${fdate(hh.fecha)}</span>
                <span style="flex:1">${esc(hh.nota)}</span>
                <span class="badge ${Lead.color(hh.estado)}" style="flex:0 0 auto">${esc(hh.estado)}</span>
              </div>`).join("")}
          </div>`:""}
      </div>`;
    }).join(""):`<div class="empty" style="padding:30px"><h4>Sin interesados</h4><p>Todavía no hay interesados registrados.</p></div>`;
    Modal.open(`Interesados — ${p?.titulo||""}`, body,

  },
  form(propId, leadId){
    const l = leadId ? DB.leads.find(x=>x.id===leadId) : {};
    const v = (k,d="") => l[k]!=null ? l[k] : d;
    const opt = (arr,cur) => arr.map(o=>`<option ${cur===o?'selected':''}>${o}</option>`).join("");
    Modal.open(leadId?"Editar interesado":"Registrar interesado", `

        <div class="field"><label>Estado</label><select id="l_estado">${opt(["Nuevo","Contactado","Visita agendada","Negociando","Descartado"], v('estado'))}</select></div></div>
      <div class="form-row"><div class="field"><label>Fecha de contacto</label><input id="l_fecha" type="date" value="${esc(v('fecha',today))}"></div>

  },
  save(propId, leadId){
    const g = k=>document.getElementById('l_'+k).value;
    if (!g('nombre')) { alert("Poné el nombre del interesado."); return; }
    if (leadId) {
      const l = DB.leads.find(x=>x.id===leadId);
      Object.assign(l, { nombre:g('nombre'), contacto:g('contacto'), origen:g('origen'),
        estado:g('estado'), fecha:g('fecha'), proxima:g('proxima'), nota:g('nota') });
      persist('leads', l);
    } else {
      const nuevo = { id:DB.nextId.leads++, propId, nombre:g('nombre'), contacto:g('contacto'),
        origen:g('origen'), estado:g('estado'), fecha:g('fecha'), proxima:g('proxima'), nota:g('nota') };
      DB.leads.push(nuevo);
      persist('leads', nuevo);
      persistMeta();
    }
    Lead.list(propId);
  },
  /* --- Marcar un seguimiento como REALIZADO ---
     La alarma no se borra sola: recién se limpia cuando se registra acá
     qué pasó en el contacto y cuál es el próximo paso. */
  realizar(leadId){
    const l = DB.leads.find(x=>x.id===leadId);
    if (!l) return;
    const p = prop(l.propId);
    const opt = (arr,cur) => arr.map(o=>`<option ${cur===o?'selected':''}>${o}</option>`).join("");
    Modal.open(`Seguimiento realizado — ${esc(l.nombre)}`, `

        <div class="t-muted" style="font-size:12.5px">${esc(l.contacto||"sin contacto cargado")} · Estaba previsto para el ${fdate(l.proxima)}</div>
      </div>
      <div class="form-row one"><div class="field">
        <label>¿Qué pasó en este contacto?</label>
        <textarea id="r_nota" rows="3" placeholder="Ej: lo llamé, quiere visitar el sábado. / No atendió, reintentar. / Ofertó USD 100.000."></textarea>
      </div></div>
      <div class="form-row">
        <div class="field"><label>Estado del interesado</label>
          <select id="r_estado">${opt(["Nuevo","Contactado","Visita agendada","Negociando","Descartado"], l.estado)}</select></div>
        <div class="field"><label>Próxima acción (fecha)</label>
          <input id="r_proxima" type="date" value="">
          <div class="hint">Si lo dejás vacío, el seguimiento queda cerrado y no vuelve a avisar.</div></div>
      </div>
    `, `<button class="btn" onclick="Modal.close()">Cancelar</button>
        <button class="btn btn-primary" onclick="Lead.guardarRealizado(${leadId})">${I.check} Confirmar realizada</button>`);
  },

  guardarRealizado(leadId){
    const l = DB.leads.find(x=>x.id===leadId);
    if (!l) return;
    const nota = (document.getElementById('r_nota').value||"").trim();
    const estado = document.getElementById('r_estado').value;
    const proxima = document.getElementById('r_proxima').value;

    // Guardar en el historial de seguimientos
    l.historial = l.historial || [];
    l.historial.unshift({ fecha: today, nota: nota || "(sin nota)", estado });

    // Este contacto pasa a ser el último realizado
    l.fecha = today;
    l.estado = estado;
    // La próxima acción reemplaza a la anterior. Si queda vacía,
    // no hay más alarma para este interesado.
    l.proxima = proxima || null;
    if (nota) l.nota = nota;

    persist('leads', l);
    Modal.close();
    App.go(STATE.page);
    setTimeout(()=>{
      const msg = proxima
        ? `Seguimiento registrado.\nPróximo contacto: ${fdate(proxima)}.`
        : `Seguimiento registrado y cerrado.\nEste interesado no va a volver a generar alarmas hasta que le cargues una nueva acción.`;
      alert(msg);
    },100);
  },

  color(s){ return {"Nuevo":"blue","Contactado":"amber","Visita agendada":"amber","Negociando":"green","Descartado":"gray"}[s]||"gray"; }
};

// Mapa de colecciones de Firestore <-> arrays locales de DB
const COLECCIONES = {
  properties: "propiedades",
  leads: "interesados",
};

const Auth = {
  // Dominio interno: el usuario NO lo ve ni lo escribe. Se agrega solo.
  DOMINIO: "@laescribania.com",
  async login(){
    let usuario = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPass').value;
    const errBox = document.getElementById('loginError');
    errBox.textContent = "";
    if (!usuario || !pass) { errBox.textContent = "Completá usuario y contraseña."; return; }
    // Si la persona escribió solo el usuario, le agregamos el dominio interno.
    // (Si por costumbre escribiera el correo completo, lo respetamos.)
    const email = usuario.includes("@") ? usuario : usuario + Auth.DOMINIO;
    try {
      await fbAuth.signInWithEmailAndPassword(email, pass);
      // el onAuthStateChanged se encarga del resto
    } catch(e) {
      const msg = {
        'auth/invalid-email':'El usuario no es válido.',
        'auth/user-not-found':'No existe ese usuario.',
        'auth/wrong-password':'Contraseña incorrecta.',
        'auth/invalid-credential':'Usuario o contraseña incorrectos.',
        'auth/too-many-requests':'Demasiados intentos. Esperá unos minutos.',
      }[e.code] || 'No se pudo iniciar sesión. Revisá los datos.';
      errBox.textContent = msg;
    }
  },
  async logout(){
    await fbAuth.signOut();
    location.reload();
  }
};

// Guardar (crear o actualizar) un item en Firestore.
// arrayName: 'properties' | 'leads'
async function persist(arrayName, item){
  try {
    const col = COLECCIONES[arrayName];
    if (!col || !item) return;
    await fbDB.collection(col).doc(String(item.id)).set(JSON.parse(JSON.stringify(item)));
  } catch(e){
    console.error("Error al guardar en Firebase:", e);
    alert("No se pudo guardar el cambio en la nube. Revisá tu conexión.");
  }
}

// Eliminar un item de Firestore
async function persistDelete(arrayName, id){
  try {
    const col = COLECCIONES[arrayName];
    if (!col) return;
    await fbDB.collection(col).doc(String(id)).delete();
  } catch(e){
    console.error("Error al eliminar en Firebase:", e);
  }
}

// Guardar los contadores (nextId / nextCodigo) para que no se repitan
async function persistMeta(){
  try {
    await fbDB.collection("meta").doc("contadores").set({
      nextId: DB.nextId, nextCodigo: DB.nextCodigo,
      cotizacion: DB.cotizacion, cotizacionFecha: DB.cotizacionFecha
    });
  } catch(e){ console.error("Error guardando contadores:", e); }
}

// Cargar todos los datos desde Firestore al objeto DB local
async function cargarDatos(){
  // Propiedades
  const propsSnap = await fbDB.collection("propiedades").get();
  DB.properties = propsSnap.docs.map(d=>d.data());
  // Interesados
  const leadsSnap = await fbDB.collection("interesados").get();
  DB.leads = leadsSnap.docs.map(d=>d.data());
  // Contadores
  const metaDoc = await fbDB.collection("meta").doc("contadores").get();
  if (metaDoc.exists) {
    const m = metaDoc.data();
    DB.nextId = m.nextId || DB.nextId;
    DB.nextCodigo = m.nextCodigo || DB.nextCodigo;
    if (m.cotizacion) DB.cotizacion = m.cotizacion;
    if (m.cotizacionFecha) DB.cotizacionFecha = m.cotizacionFecha;
  } else {
    // primera vez: calcular contadores a partir de lo que haya
    const maxId = arr => arr.reduce((mx,x)=>Math.max(mx,x.id||0),0);
    DB.nextId = {
      properties: maxId(DB.properties)+1,
      leads: maxId(DB.leads)+1,
    };
    DB.nextCodigo = DB.properties.reduce((mx,p)=>{
      const n = p.codigo ? parseInt(String(p.codigo).replace(/\D/g,''))||0 : 0;
      return Math.max(mx,n);
    },0) + 1;
  }
}

// Leer el rol del usuario logueado desde la colección "usuarios"
async function cargarRolUsuario(uid){
  const doc = await fbDB.collection("usuarios").doc(uid).get();
  if (!doc.exists) return null;
  return doc.data(); // { rol: 'admin'|'sales'|'rentals'|'viewer', nombre: '...' }
}

// Punto de entrada: reacciona al login/logout
fbAuth.onAuthStateChanged(async (user)=>{
  const loginScreen = document.getElementById('loginScreen');
  const bootLoader = document.getElementById('bootLoader');
  if (!user) {
    // no logueado: mostrar login
    loginScreen.style.display = "flex";
    bootLoader.style.display = "none";
    return;
  }
  // logueado: ocultar login, mostrar loader, cargar todo
  loginScreen.style.display = "none";
  bootLoader.style.display = "flex";
  try {
    const perfil = await cargarRolUsuario(user.uid);
    if (!perfil || !perfil.rol) {
      bootLoader.style.display = "none";
      await fbAuth.signOut();
      loginScreen.style.display = "flex";
      document.getElementById('loginError').textContent =
        "Tu cuenta no tiene un rol asignado. Pedile al administrador que lo configure.";
      return;
    }
    STATE.usuario = { uid:user.uid, email:user.email, nombre:perfil.nombre||user.email, rol:perfil.rol };
    await cargarDatos();
    bootLoader.style.display = "none";
    // arrancar la app con el rol real del usuario
    App.initFirebase(perfil.rol);
  } catch(e){
    console.error(e);
    bootLoader.style.display = "none";
    alert("Hubo un problema al cargar el sistema. Revisá tu conexión e intentá de nuevo.");
  }
});
</script>
