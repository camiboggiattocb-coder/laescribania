<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Escribanía — Gestión de Ventas</title>
<style>
  :root {
    --ink: #1a2332;
    --ink-soft: #4a5568;
    --paper: #f4f5f7;
    --surface: #ffffff;
    --line: #e2e6ec;
    --line-strong: #cbd3df;
    --brand: #1f4e6b;
    --brand-deep: #163a50;
    --brand-soft: #e8f0f5;
    --accent: #c9821e;
    --accent-soft: #fbf0dd;
    --green: #2e7d4f;
    --green-soft: #e3f1e8;
    --red: #c0392b;
    --red-soft: #fbe9e7;
    --amber: #b8860b;
    --amber-soft: #fdf3d8;
    --radius: 8px;
    --shadow: 0 1px 3px rgba(22,58,80,.08), 0 1px 2px rgba(22,58,80,.04);
    --shadow-lg: 0 8px 28px rgba(22,58,80,.16);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--paper); color: var(--ink); font-size: 14px; line-height: 1.5; }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: 14px; }

  /* Layout */
  .app { display: flex; min-height: 100vh; }
  .sidebar {
    width: 230px; background: var(--brand-deep); color: #dfe8ee; flex-shrink: 0;
    display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 30;
  }
  .sidebar .brand { padding: 18px 18px 16px; border-bottom: 1px solid rgba(255,255,255,.1); text-align: center; }
  .brand-logo { background: #f4f1ea; border-radius: 12px; padding: 10px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; }
  .brand-logo img { width: 100%; max-width: 150px; height: auto; display: block; border-radius: 6px; }
  .sidebar .brand h1 { font-size: 13.5px; font-weight: 600; color: #cddae3; letter-spacing: .3px; line-height: 1.3; }
  .sidebar .brand span { font-size: 11px; color: #8fb0c4; text-transform: uppercase; letter-spacing: 1px; }
  .nav { padding: 12px 0; flex: 1; overflow-y: auto; }
  .nav-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; color: #6f93a8; padding: 14px 20px 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 11px; padding: 9px 20px; color: #c4d4de;
    border: none; background: none; width: 100%; text-align: left; font-size: 13.5px; transition: all .15s;
    border-left: 3px solid transparent;
  }
  .nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
  .nav-item.active { background: rgba(255,255,255,.09); color: #fff; border-left-color: var(--accent); font-weight: 600; }
  .nav-item .ic { width: 17px; height: 17px; flex-shrink: 0; opacity: .85; }
  .nav-foot { padding: 14px 20px; border-top: 1px solid rgba(255,255,255,.1); font-size: 12px; color: #8fb0c4; }
  .user-badge { display: flex; align-items: center; gap: 9px; }
  .user-badge .av { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; }

  .main { flex: 1; margin-left: 230px; display: flex; flex-direction: column; min-height: 100vh; }
  .topbar {
    background: var(--surface); border-bottom: 1px solid var(--line); padding: 0 28px;
    height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 20;
  }
  .topbar .crumb { font-size: 13px; color: var(--ink-soft); }
  .topbar .crumb b { color: var(--ink); font-weight: 600; }
  .topbar-actions { display: flex; align-items: center; gap: 12px; }
  .content { padding: 26px 28px 60px; max-width: 1280px; width: 100%; }

  /* Role switch */
  .role-switch { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .role-switch select { padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--ink); }

  /* Page head */
  .page-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 22px; gap: 16px; flex-wrap: wrap; }
  .page-head h2 { font-size: 22px; font-weight: 700; color: var(--ink); letter-spacing: -.3px; }
  .page-head p { color: var(--ink-soft); margin-top: 3px; font-size: 13.5px; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 500; transition: all .15s; }
  .btn:hover { background: #f8f9fb; border-color: var(--brand); }
  .btn-primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  .btn-primary:hover { background: var(--brand-deep); color: #fff; }
  .btn-sm { padding: 6px 11px; font-size: 12px; }
  .btn .ic { width: 15px; height: 15px; }

  /* Cards & grid */
  .grid { display: grid; gap: 16px; }
  .stat-grid { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .stat { padding: 18px 20px; }
  .stat .lbl { font-size: 12px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .6px; font-weight: 600; }
  .stat .val { font-size: 28px; font-weight: 700; color: var(--ink); margin-top: 6px; letter-spacing: -.5px; }
  .stat .sub { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
  .stat .val.brand { color: var(--brand); padding: 0; text-align: left; border: none; }

  /* Section */
  .section { margin-top: 26px; }
  .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 13px; }
  .section-head h3 { font-size: 16px; font-weight: 700; color: var(--ink); }

  /* Table */
  .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; }
  thead th { background: #f7f9fb; text-align: left; padding: 11px 16px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-soft); font-weight: 700; border-bottom: 1px solid var(--line); white-space: nowrap; }
  tbody td { padding: 13px 16px; border-bottom: 1px solid var(--line); font-size: 13.5px; vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fafbfc; }
  tbody tr.sold { background: #fdecea; }
  tbody tr.sold:hover { background: #fbe0dc; }
  tbody tr.sold td:first-child { box-shadow: inset 3px 0 0 var(--red); }
  .code-tag { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; font-weight: 700; color: var(--brand); background: var(--brand-soft); padding: 2px 7px; border-radius: 5px; white-space: nowrap; }
  .t-strong { font-weight: 600; color: var(--ink); }
  .t-muted { color: var(--ink-soft); font-size: 12.5px; }

  /* Badges */
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .badge.green { background: var(--green-soft); color: var(--green); }
  .badge.red { background: var(--red-soft); color: var(--red); }
  .badge.amber { background: var(--amber-soft); color: var(--amber); }
  .badge.blue { background: var(--brand-soft); color: var(--brand); }
  .badge.gray { background: #eef1f4; color: var(--ink-soft); }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill { display: inline-flex; padding: 2px 9px; border-radius: 5px; font-size: 11px; font-weight: 600; background: #eef1f4; color: var(--ink-soft); }
  .pill.sale { background: var(--brand-soft); color: var(--brand); }
  .pill.rent { background: var(--accent-soft); color: var(--accent); }

  /* Empty state */
  .empty { text-align: center; padding: 54px 20px; color: var(--ink-soft); }
  .empty .ic { width: 44px; height: 44px; margin: 0 auto 14px; opacity: .4; }
  .empty h4 { font-size: 16px; color: var(--ink); margin-bottom: 6px; font-weight: 600; }
  .empty p { font-size: 13.5px; max-width: 380px; margin: 0 auto 16px; }

  /* Tabs */
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
  .tab { padding: 10px 18px; border: none; background: none; font-size: 14px; color: var(--ink-soft); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; }

  /* Modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(22,40,55,.45); display: none; align-items: flex-start; justify-content: center; z-index: 50; padding: 40px 16px; overflow-y: auto; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--surface); border-radius: 12px; width: 100%; max-width: 620px; box-shadow: var(--shadow-lg); animation: pop .18s ease; }
  .modal.wide { max-width: 920px; }
  @keyframes pop { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-head { padding: 20px 24px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .modal-head h3 { font-size: 17px; font-weight: 700; }
  .modal-body { padding: 22px 24px; max-height: 60vh; overflow-y: auto; }
  .modal-foot { padding: 16px 24px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 10px; }
  .x-btn { background: none; border: none; font-size: 22px; color: var(--ink-soft); line-height: 1; padding: 0 4px; }

  /* Forms */
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .form-row.one { grid-template-columns: 1fr; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink); margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .field .hint { font-size: 11.5px; color: var(--ink-soft); margin-top: 4px; }

  /* Drive link */
  .drive-link { display: inline-flex; align-items: center; gap: 6px; color: var(--brand); font-weight: 600; font-size: 13px; text-decoration: none; }
  .drive-link:hover { text-decoration: underline; }

  /* Alarm list */
  .alarm { display: flex; gap: 13px; padding: 14px 16px; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .alarm:last-child { border-bottom: none; }
  .alarm-ic { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .alarm-ic.red { background: var(--red-soft); color: var(--red); }
  .alarm-ic.amber { background: var(--amber-soft); color: var(--amber); }
  .alarm-ic.blue { background: var(--brand-soft); color: var(--brand); }
  .alarm-body { flex: 1; }
  .alarm-body .t { font-weight: 600; font-size: 13.5px; }
  .alarm-body .d { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .alarm-time { font-size: 12px; color: var(--ink-soft); white-space: nowrap; }

  /* Detail */
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 28px; }
  .detail-item .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--ink-soft); font-weight: 600; }
  .detail-item .v { font-size: 14.5px; color: var(--ink); margin-top: 3px; }

  .hidden { display: none !important; }
  .row-actions { display: flex; gap: 6px; }
  .icon-btn { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; color: var(--ink-soft); }
  .icon-btn:hover { border-color: var(--brand); color: var(--brand); }
  .icon-btn .ic { width: 15px; height: 15px; }

  .notice { background: var(--accent-soft); border: 1px solid #f0d8a8; border-radius: 8px; padding: 13px 16px; font-size: 13px; color: #7a5610; display: flex; gap: 10px; align-items: flex-start; margin-bottom: 20px; }
  .notice .ic { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; }

  @media (max-width: 860px) {
    .sidebar { transform: translateX(-100%); transition: transform .2s; }
    .sidebar.open { transform: translateX(0); }
    .main { margin-left: 0; }
    .menu-toggle { display: inline-flex !important; }
    .form-row { grid-template-columns: 1fr; }
    .detail-grid { grid-template-columns: 1fr; }
  }
  .menu-toggle { display: none; }

  /* --- Agregados v2 --- */
  .checkbox-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .checkbox-grid label { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; color: var(--ink); padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  .checkbox-grid label:hover { border-color: var(--brand); background: #f8f9fb; }
  .checkbox-grid input { width: auto; margin: 0; }
  .form-section { border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 14px; background: #fafbfc; }
  .form-section > h4 { font-size: 13px; font-weight: 700; color: var(--brand); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 13px; display: flex; align-items: center; gap: 7px; }
  .form-section > h4 .ic { width: 15px; height: 15px; }
  .breakdown { background: var(--brand-soft); border-radius: 8px; padding: 14px 16px; margin-top: 6px; }
  .breakdown .line { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13.5px; }
  .breakdown .line.total { border-top: 1px solid var(--line-strong); margin-top: 6px; padding-top: 9px; font-weight: 700; font-size: 16px; color: var(--brand); }
  .file-drop { border: 1.5px dashed var(--line-strong); border-radius: 8px; padding: 16px; text-align: center; color: var(--ink-soft); font-size: 13px; cursor: pointer; transition: all .15s; }
  .file-drop:hover { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
  .file-drop.has-file { border-style: solid; border-color: var(--green); background: var(--green-soft); color: var(--green); font-weight: 600; }
  .file-row { display: flex; align-items: center; gap: 8px; justify-content: center; }
  .timeline { list-style: none; }
  .timeline li { padding: 7px 0 7px 18px; border-left: 2px solid var(--line-strong); position: relative; font-size: 13px; }
  .timeline li::before { content: ''; position: absolute; left: -5px; top: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--brand); }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 7px; overflow: hidden; }
  .seg button { padding: 8px 14px; border: none; background: var(--surface); font-size: 13px; color: var(--ink-soft); }
  .seg button.active { background: var(--brand); color: #fff; font-weight: 600; }

  /* --- Filtros --- */
  .filtros { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 18px; }
  .filtros-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .filtros-head h3 { font-size: 14px; font-weight: 700; color: var(--brand); text-transform: uppercase; letter-spacing: .5px; display: flex; align-items: center; gap: 7px; }
  .filtros-head h3 .ic { width: 16px; height: 16px; }
  .filtros-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px 16px; align-items: end; }
  .filtros-grid .field label { display:block; font-size: 11.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .4px; }
  .filtros-grid .field input, .filtros-grid .field select { width: 100%; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--ink); font-size: 13px; }
  .filtros-grid .field input:focus, .filtros-grid .field select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .rango { display: flex; align-items: center; gap: 6px; }
  .rango input { min-width: 0; flex: 1 1 auto; }
  .rango span { color: var(--ink-soft); font-size: 12px; flex: 0 0 auto; }
  .rango .sel-moneda { flex: 0 0 78px; width: 78px; }
  /* El rango de precio necesita más ancho: ocupa dos columnas de la grilla */
  .filtros-grid .campo-precio { grid-column: span 2; min-width: 340px; }
  @media (max-width: 760px){ .filtros-grid .campo-precio { grid-column: span 1; min-width: 0; } }
  .chk-inline { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; color: var(--ink); padding: 8px 0; }
  .chk-inline input { width: auto !important; }
  .filtros-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; gap: 10px; flex-wrap: wrap; }
  .filtros-count { font-size: 13px; color: var(--ink-soft); }
  .filtros-count b { color: var(--brand); }
</style>

<body>
<!-- ============================================================
     PANTALLA DE LOGIN (Firebase Authentication)
     ============================================================ -->
<div id="loginScreen" style="position:fixed;inset:0;z-index:200;background:linear-gradient(135deg,#163a50,#1f4e6b);display:flex;align-items:center;justify-content:center;padding:20px">
  <div style="background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:380px;padding:34px 30px">

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const fmt = (n, cur="ARS") => {
  if (n == null || isNaN(n)) return "—";
  const s = new Intl.NumberFormat("es-AR",{maximumFractionDigits:0}).format(n);
  return (cur==="USD"?"US$ ":"$ ") + s;
};
// Formato de fecha argentino: dd/mm/aaaa
const fdate = d => {
  if(!d) return "—";
  const s = String(d).trim();
  // formato guardado (aaaa-mm-dd)
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[3]}/${m[2]}/${m[1]}`;
  // ya viene como dd/mm/aaaa
  if (/^\d{2}\/\d{2}\/\d{4}$/.test(s)) return s;
  // cualquier otro caso: intentar parsear
  const dt = new Date(s);
  if (!isNaN(dt)) {
    const p = n => String(n).padStart(2,"0");
    return `${p(dt.getDate())}/${p(dt.getMonth()+1)}/${dt.getFullYear()}`;
  }
  return "—";
};
const daysBetween = (a,b) => Math.round((new Date(b)-new Date(a))/86400000);
const addMonths = (d, n) => { const dt = new Date(d); dt.setMonth(dt.getMonth()+n); return dt.toISOString().slice(0,10); };
const today = new Date().toISOString().slice(0,10);
const prop = id => DB.properties.find(p=>p.id===id);
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isVivienda = t => t==="Casa" || t==="Departamento";
const esVendida = p => p.enVenta && p.estadoOp === "Vendida";

/* ---------- Motor de alarmas ---------- */
function computeAlarms() {
  const out = [];
  DB.leads.forEach(l => {
    // Funciona como agenda: TODO interesado con un próximo contacto agendado
    // aparece, sin importar cuántos días falten. La alarma no desaparece sola
    // con el paso del tiempo: queda activa hasta que alguien la marque como
    // realizada (Lead.realizar). Los interesados descartados no generan alarma.
    if (l.proxima && l.estado !== "Descartado") {
      const dd = daysBetween(today, l.proxima);
      const p = prop(l.propId);
      // Color: rojo si está atrasado, ámbar si es hoy o mañana, azul si es futuro
      const level = dd<0 ? "red" : (dd<=1 ? "amber" : "blue");
      out.push({ level, icon:I.users, dd,
        title:`Seguimiento — ${l.nombre}`,
        desc:`${p?.titulo||""} · ${l.estado}${l.contacto?` · ${l.contacto}`:""}. Contacto previsto: ${fdate(l.proxima)}`,
        when: dd<0?`Atrasado ${-dd} ${-dd===1?'día':'días'}`:(dd===0?"Hoy":(dd===1?"Mañana":`En ${dd} días`)),
        cat:"sales",
        action:`Lead.realizar(${l.id})`,
        actionLabel:"Marcar realizada" });
    }
  });
  // Orden cronológico: primero lo más atrasado / más próximo, luego lo lejano
  return out.sort((a,b)=>a.dd-b.dd);
}

/* ============================================================
   FILTROS  (maestro y ventas; el visor filtra por precio sin verlo)
   ============================================================ */
const Filtros = {
  // Cotización usada para comparar precios en distinta moneda.
  // Lee el valor cargado por el usuario (editable desde el Resumen global).
  get USD_ARS(){ return DB.cotizacion || 1000; },

  estado(page){ return STATE.filtros[page]; },

  // Lista de localidades presentes en las propiedades dadas
  localidades(props){
    const set = new Set();
    props.forEach(p=>{ if(p.localidad) set.add(p.localidad.trim()); });
    return Array.from(set).sort((a,b)=>a.localeCompare(b,'es'));
  },

  // Lista de barrios presentes en las propiedades dadas
  barrios(props){
    const set = new Set();
    (props||[]).forEach(p=>{ if(p.barrio) set.add(p.barrio.trim()); });
    return Array.from(set).sort((a,b)=>a.localeCompare(b,'es'));
  },

  // Pasa el valor de venta a la moneda elegida para comparar el rango
  aMoneda(p, moneda){
    if (p.valorVenta==null) return null;
    const m = p.monedaVenta || "USD";
    if (m===moneda) return p.valorVenta;
    if (moneda==="USD" && m==="ARS") return p.valorVenta / Filtros.USD_ARS;
    if (moneda==="ARS" && m==="USD") return p.valorVenta * Filtros.USD_ARS;
    return p.valorVenta;
  },

  // Aplica los filtros de la página a una lista de propiedades
  aplicar(page, props){
    const f = Filtros.estado(page);
    return props.filter(p=>{
      if (f.q){
        const t = (esc(p.titulo)+" "+esc(p.direccion)+" "+esc(p.localidad)+" "+esc(p.barrio)+" "+esc(p.codigo)).toLowerCase();
        if (!t.includes(f.q.toLowerCase())) return false;
      }
      if (f.localidad && (p.localidad||"").trim() !== f.localidad) return false;
      if (f.barrio && (p.barrio||"").trim() !== f.barrio) return false;
      if (f.tipo && p.tipo !== f.tipo) return false;
      if (f.dorm){
        const d = p.dorm||0;
        if (f.dorm==="4") { if (d < 4) return false; }
        else if (d !== parseInt(f.dorm)) return false;
      }
      if (f.cochera && !(p.cochera && p.cochera!=="No tiene")) return false;
      if (f.patio && !p.patio) return false;
      // Rango de precio: funciona aunque el precio no se muestre (visor)
      if (f.precMin!=="" || f.precMax!==""){
        const val = Filtros.aMoneda(p, f.precMoneda);
        if (val==null) return false;
        if (f.precMin!=="" && val < parseFloat(f.precMin)) return false;
        if (f.precMax!=="" && val > parseFloat(f.precMax)) return false;
      }
      return true;
    });
  },

  // Dibuja el panel de filtros
  panel(page, props){
    const f = Filtros.estado(page);
    const locs = Filtros.localidades(props);
    const barrs = Filtros.barrios(props);
    const tipos = ["Casa","Departamento","Local","Terreno","Galpón","Oficina","Campo"];
    const sel = (cur,val)=> cur===val ? "selected":"";
    return `
    <div class="filtros">
      <div class="filtros-head">
        <h3>${I.search||I.eye} Filtros de búsqueda</h3>
        <button class="btn btn-sm" onclick="Filtros.limpiar('${page}')">Limpiar</button>
      </div>
      <div class="filtros-grid">
        <div class="field"><label>Buscar</label>
          <input type="text" id="filtro_q_${page}" value="${esc(f.q)}" placeholder="Título, dirección, código…" oninput="Filtros.setText('${page}',this.value)"></div>
        <div class="field"><label>Localidad</label>
          <select onchange="Filtros.set('${page}','localidad',this.value)">
            <option value="">Todas</option>
            ${locs.map(l=>`<option ${sel(f.localidad,l)}>${esc(l)}</option>`).join("")}
          </select></div>
        <div class="field"><label>Barrio</label>
          <select onchange="Filtros.set('${page}','barrio',this.value)">
            <option value="">Todos</option>
            ${barrs.map(b=>`<option ${sel(f.barrio,b)}>${esc(b)}</option>`).join("")}
          </select></div>
        <div class="field"><label>Tipo</label>
          <select onchange="Filtros.set('${page}','tipo',this.value)">
            <option value="">Todos</option>
            ${tipos.map(t=>`<option ${sel(f.tipo,t)}>${t}</option>`).join("")}
          </select></div>
        <div class="field"><label>Dormitorios</label>
          <select onchange="Filtros.set('${page}','dorm',this.value)">
            <option value="">Cualquiera</option>
            <option ${sel(f.dorm,'1')} value="1">1</option>
            <option ${sel(f.dorm,'2')} value="2">2</option>
            <option ${sel(f.dorm,'3')} value="3">3</option>
            <option ${sel(f.dorm,'4')} value="4">4 o más</option>
          </select></div>
        <div class="field campo-precio"><label>Rango de precio</label>
          <div class="rango">
            <input type="text" inputmode="numeric" id="filtro_min_${page}" value="${esc(f.precMin)}" placeholder="Mínimo" oninput="Filtros.setNum('${page}','precMin',this)">
            <span>—</span>
            <input type="text" inputmode="numeric" id="filtro_max_${page}" value="${esc(f.precMax)}" placeholder="Máximo" oninput="Filtros.setNum('${page}','precMax',this)">
            <select onchange="Filtros.set('${page}','precMoneda',this.value)" class="sel-moneda">
              <option ${sel(f.precMoneda,'USD')}>USD</option>
              <option ${sel(f.precMoneda,'ARS')}>ARS</option>
            </select>
          </div></div>
        <div class="field">
          <label>Comodidades</label>
          <label class="chk-inline"><input type="checkbox" ${f.cochera?'checked':''} onchange="Filtros.set('${page}','cochera',this.checked)"> Con cochera/garage</label>
          <label class="chk-inline" style="padding-top:0"><input type="checkbox" ${f.patio?'checked':''} onchange="Filtros.set('${page}','patio',this.checked)"> Con patio/jardín</label>
        </div>
      </div>
    </div>`;
  },

  set(page, key, val){
    STATE.filtros[page][key] = val;
    App.go(page); // re-render preservando estado de filtros
  },

  // Para el campo de texto: re-render pero devolviendo el foco al input
  // y el cursor al final, para que se pueda seguir escribiendo.
  setText(page, val){
    STATE.filtros[page].q = val;
    App.go(page);
    const el = document.getElementById('filtro_q_'+page);
    if (el){ el.focus(); const n=el.value.length; el.setSelectionRange(n,n); }
  },

  // Campos numéricos de precio: acepta cifras largas y devuelve el foco
  // al input para poder seguir tipeando sin que se corte el número.
  setNum(page, key, input){
    const limpio = (input.value||"").replace(/[^\d]/g,""); // solo dígitos
    STATE.filtros[page][key] = limpio;
    App.go(page);
    const id = (key==='precMin'?'filtro_min_':'filtro_max_')+page;
    const el = document.getElementById(id);
    if (el){ el.focus(); const n=el.value.length; el.setSelectionRange(n,n); }
  },

  limpiar(page){
    STATE.filtros[page] = { q:"", localidad:"", barrio:"", tipo:"", dorm:"", cochera:false, patio:false, precMin:"", precMax:"", precMoneda:"USD" };
    App.go(page);
  },

  // Texto del contador de resultados
  contador(n, total){
    return `<div class="filtros-count">Mostrando <b>${n}</b> de ${total} ${total===1?'propiedad':'propiedades'}</div>`;
  }
};

const App = {
  // En la versión Firebase el rol lo fija el usuario logueado (no hay selector).
  initFirebase(rol){
    STATE.role = rol;
    const cfg = ROLES[rol] || ROLES.viewer;
    // datos del usuario en la barra superior
    const tn = document.getElementById('topUserName');
    const tr = document.getElementById('topUserRole');
    if (tn) tn.textContent = STATE.usuario?.nombre || "";
    if (tr) tr.textContent = cfg.name;
    // datos del usuario en el pie de la barra lateral
    $("#userAv").textContent = (STATE.usuario?.nombre || cfg.name).charAt(0).toUpperCase();
    $("#userName").textContent = STATE.usuario?.nombre || cfg.name;
    $("#userRole").textContent = cfg.name;
    const allowed = cfg.pages;
    this.go(allowed[0]);
  },

  // setRole se mantiene por compatibilidad interna, sin selector
  setRole(r){
    STATE.role = r;
    const cfg = ROLES[r];
    const allowed = cfg.pages;
    this.go(allowed.includes(STATE.page) ? STATE.page : allowed[0]);
  },

  renderNav(){
    const allowed = ROLES[STATE.role].pages;
    let lastWasSep = true; let html = "";
    NAV.forEach(n=>{
      if (n.sep){ html += `<div class="nav-label">${n.sep}</div>`; return; }
      if (!allowed.includes(n.id)) return;
      html += `<button class="nav-item ${STATE.page===n.id?'active':''}" onclick="App.go('${n.id}')">${n.icon}<span>${n.label}</span></button>`;
    });
    $("#nav").innerHTML = html;
  },

  go(page){
    STATE.page = page;
    if (!ROLES[STATE.role].pages.includes(page)) page = ROLES[STATE.role].pages[0], STATE.page = page;
    this.renderNav();
    const item = NAV.find(n=>n.id===page);
    $("#crumb").innerHTML = `<b>${item?item.label:""}</b>`;
    document.getElementById('sidebar').classList.remove('open');
    const fn = "render_"+page;
    $("#content").innerHTML = this[fn] ? this[fn]() : "<p>En construcción</p>";
  },


  /* ---------- PANEL PRINCIPAL (operativo del día a día) ---------- */
  render_dashboard(){
    const ventas = DB.properties.filter(p=>p.enVenta);
    const disponibles = ventas.filter(p=>!esVendida(p));
    const vendidas = ventas.filter(p=>esVendida(p));
    const reservadas = ventas.filter(p=>p.estadoOp==="Reservada"||p.estadoOp==="Con seña");
    const alarms = computeAlarms();
    const atrasadas = alarms.filter(a=>a.level==="red").length;
    const leadsActivos = DB.leads.filter(l=>l.estado!=="Descartado");

    return `
      <div class="page-head">
        <div><h2>Panel principal</h2><p>Tu día de trabajo · ${fdate(today)}</p></div>
        <button class="btn btn-primary" onclick="Prop.form()">${I.plus} Nueva propiedad</button>
      </div>

      <div class="grid stat-grid">
        <div class="card stat"><div class="lbl">En venta</div><div class="val brand">${disponibles.length}</div><div class="sub">propiedades disponibles</div></div>
        <div class="card stat"><div class="lbl">En negociación</div><div class="val">${reservadas.length}</div><div class="sub">reservadas o con seña</div></div>
        <div class="card stat"><div class="lbl">Interesados activos</div><div class="val">${leadsActivos.length}</div><div class="sub">en seguimiento</div></div>
        <div class="card stat"><div class="lbl">Vendidas</div><div class="val">${vendidas.length}</div><div class="sub">operaciones cerradas</div></div>
      </div>

      <!-- ALARMAS: lo primero que hay que resolver -->
      <div class="section">
        <div class="section-head">
          <h3>Seguimientos pendientes${atrasadas?` — <span style="color:var(--red)">${atrasadas} ${atrasadas===1?'atrasado':'atrasados'}</span>`:""}</h3>
          ${alarms.length>5?`<button class="btn btn-sm" onclick="App.go('alarms')">Ver los ${alarms.length}</button>`:""}
        </div>
        <div class="card">
          ${alarms.length ? alarms.slice(0,8).map(a=>App.alarmRow(a)).join("")
          : `<div class="empty"><div class="ic">${I.bell}</div><h4>Todo al día</h4><p>No hay seguimientos pendientes. Todos fueron marcados como realizados.</p></div>`}
        </div>
      </div>

      ${ROLES[STATE.role].pages.includes("resumen")?`
      <div class="notice" style="margin-top:18px">${I.chart}<div>
        ¿Buscás los números de la inmobiliaria (valor de la cartera, comisiones, propiedades estancadas)?
        Están en <b><a href="#" onclick="App.go('resumen');return false" style="color:var(--brand)">Resumen global</a></b>, al final del menú.
      </div></div>`:""}
    `;
  },

  /* ---------- RESUMEN GLOBAL (dirección / toma de decisiones) ---------- */
  render_resumen(){
    const ventas = DB.properties.filter(p=>p.enVenta);
    const disponibles = ventas.filter(p=>!esVendida(p));
    const vendidas = ventas.filter(p=>esVendida(p));
    const reservadas = ventas.filter(p=>p.estadoOp==="Reservada"||p.estadoOp==="Con seña");
    const leadsActivos = DB.leads.filter(l=>l.estado!=="Descartado");

    // --- Valor de la cartera y comisiones (todo llevado a USD) ---
    const enUSD = p => Filtros.aMoneda(p,"USD") || 0;
    // Para las vendidas usamos el precio REAL de cierre, no el de publicación
    const cierreUSD = p => {
      if (p.precioVenta==null) return enUSD(p); // ventas viejas, sin cierre cargado
      const m = p.monedaVentaReal || p.monedaVenta || "USD";
      return m==="USD" ? p.precioVenta : p.precioVenta / Filtros.USD_ARS;
    };
    const comisionUSD = p => {
      if (p.comisionMonto!=null) {
        const m = p.monedaVentaReal || p.monedaVenta || "USD";
        return m==="USD" ? p.comisionMonto : p.comisionMonto / Filtros.USD_ARS;
      }
      return cierreUSD(p)*(p.comision||0)/100;
    };
    const carteraUSD = disponibles.reduce((s,p)=>s+enUSD(p),0);
    const comisionPotencial = disponibles.reduce((s,p)=>s+(enUSD(p)*(p.comision||0)/100),0);
    const vendidoUSD = vendidas.reduce((s,p)=>s+cierreUSD(p),0);
    const comisionGanada = vendidas.reduce((s,p)=>s+comisionUSD(p),0);
    const precioProm = disponibles.length ? carteraUSD/disponibles.length : 0;

    // --- Publicado vs. cerrado: ¿cuánto se negocia a la baja? ---
    const conAmbos = vendidas.filter(p=>p.precioVenta!=null && p.precioPublicado!=null && p.precioPublicado>0);
    const publicadoUSD = conAmbos.reduce((s,p)=>{
      const m = p.monedaPublicada || p.monedaVenta || "USD";
      return s + (m==="USD" ? p.precioPublicado : p.precioPublicado/Filtros.USD_ARS);
    },0);
    const cerradoUSD = conAmbos.reduce((s,p)=>s+cierreUSD(p),0);
    const difPct = publicadoUSD ? Math.round((cerradoUSD-publicadoUSD)*100/publicadoUSD) : null;

    // --- Tiempo en cartera / velocidad de venta ---
    const diasEnCartera = p => p.fechaPub ? daysBetween(p.fechaPub, today) : null;
    const antigs = disponibles.map(diasEnCartera).filter(d=>d!=null);
    const promDias = antigs.length ? Math.round(antigs.reduce((a,b)=>a+b,0)/antigs.length) : null;
    const estancadas = disponibles.filter(p=>{ const d=diasEnCartera(p); return d!=null && d>=120; })
                                  .sort((a,b)=>diasEnCartera(b)-diasEnCartera(a));
    const tiemposVenta = vendidas.map(p=>(p.fechaPub&&p.fechaVenta)?daysBetween(p.fechaPub,p.fechaVenta):null).filter(d=>d!=null&&d>=0);
    const promVenta = tiemposVenta.length ? Math.round(tiemposVenta.reduce((a,b)=>a+b,0)/tiemposVenta.length) : null;

    // --- Sin interesados (alerta de decisión) ---
    const sinInteres = disponibles.filter(p=>!DB.leads.some(l=>l.propId===p.id && l.estado!=="Descartado"));

    // --- Agrupaciones ---
    const agrupar = (arr, key) => {
      const m = {};
      arr.forEach(p=>{ const k=(p[key]||"Sin especificar").trim()||"Sin especificar"; m[k]=(m[k]||0)+1; });
      return Object.entries(m).sort((a,b)=>b[1]-a[1]);
    };
    const porBarrio = agrupar(disponibles,'barrio');
    const porTipo   = agrupar(disponibles,'tipo');

    // --- Reporte por captador y por vendedor ---
    const rankCaptadores = (() => {
      const m = {};
      DB.properties.filter(p=>p.enVenta).forEach(p=>{
        const c = (p.captador||"").trim(); if(!c) return;
        if(!m[c]) m[c] = { nombre:c, captadas:0, vendidas:0 };
        m[c].captadas++;
        if(esVendida(p)) m[c].vendidas++;
      });
      return Object.values(m).sort((a,b)=>b.captadas-a.captadas);
    })();
    const sinCaptador = DB.properties.filter(p=>p.enVenta && !(p.captador||"").trim()).length;

    const rankVendedores = (() => {
      const m = {};
      vendidas.forEach(p=>{
        const vd = (p.vendedor||"").trim(); if(!vd) return;
        if(!m[vd]) m[vd] = { nombre:vd, vendidas:0, comision:0 };
        m[vd].vendidas++;
        m[vd].comision += comisionUSD(p);
      });
      return Object.values(m).sort((a,b)=>b.vendidas-a.vendidas);
    })();

    // --- Embudo de interesados ---
    const estadosLead = ["Nuevo","Contactado","Visita agendada","Negociando"];
    const embudo = estadosLead.map(e=>[e, DB.leads.filter(l=>l.estado===e).length]);

    // --- Barras simples ---
    const barra = (pares, total) => pares.length ? pares.slice(0,6).map(([k,n])=>{
      const pct = total?Math.round(n*100/total):0;
      return `<div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
          <span class="t-strong">${esc(k)}</span><span class="t-muted">${n} · ${pct}%</span></div>
        <div style="height:7px;background:var(--line);border-radius:4px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:var(--brand);border-radius:4px"></div></div>
      </div>`;
    }).join("") : `<div class="t-muted" style="font-size:13px">Sin datos todavía.</div>`;

    const u = n => "USD " + Math.round(n).toLocaleString('es-AR');

    if (!ventas.length) return `
      <div class="page-head"><div><h2>Resumen global</h2><p>Estado de la inmobiliaria para la toma de decisiones</p></div></div>
      ${App.emptyState("Todavía no hay datos","Cargá propiedades y el resumen se va a armar solo.","Cargar propiedad","Prop.form()")}`;

    return `
      <div class="page-head">
        <div><h2>Resumen global</h2><p>Estado de la inmobiliaria para la toma de decisiones · ${fdate(today)}</p></div>
      </div>

      <!-- PLATA -->
      <div class="section" style="margin-top:0">
        <div class="section-head"><h3>Cartera y comisiones</h3></div>
        <div class="grid stat-grid">
          <div class="card stat"><div class="lbl">Valor de la cartera</div><div class="val brand" style="font-size:26px">${u(carteraUSD)}</div><div class="sub">${disponibles.length} propiedades disponibles</div></div>
          <div class="card stat"><div class="lbl">Comisión potencial</div><div class="val" style="font-size:26px;color:var(--green)">${u(comisionPotencial)}</div><div class="sub">si se vende toda la cartera</div></div>
          <div class="card stat"><div class="lbl">Comisión ya generada</div><div class="val" style="font-size:26px">${u(comisionGanada)}</div><div class="sub">${vendidas.length} ${vendidas.length===1?'venta cerrada':'ventas cerradas'} · ${u(vendidoUSD)}</div></div>
          <div class="card stat"><div class="lbl">Precio promedio</div><div class="val" style="font-size:26px">${u(precioProm)}</div><div class="sub">de las disponibles</div></div>
        </div>
      </div>

      <!-- RITMO -->
      <div class="section">
        <div class="section-head"><h3>Ritmo de venta</h3></div>
        <div class="grid stat-grid">
          <div class="card stat"><div class="lbl">Días en cartera</div><div class="val">${promDias!=null?promDias:"—"}</div><div class="sub">promedio de las disponibles</div></div>
          <div class="card stat"><div class="lbl">Tiempo hasta vender</div><div class="val">${promVenta!=null?promVenta:"—"}</div><div class="sub">${promVenta!=null?"días promedio (ventas cerradas)":"sin ventas cerradas aún"}</div></div>
          <div class="card stat"><div class="lbl">En negociación</div><div class="val brand">${reservadas.length}</div><div class="sub">reservadas o con seña</div></div>
          <div class="card stat"><div class="lbl">Interesados activos</div><div class="val">${leadsActivos.length}</div><div class="sub">en seguimiento</div></div>
        </div>
      </div>

      <!-- VENTAS CERRADAS -->
      ${vendidas.length?`
      <div class="section">
        <div class="section-head"><h3>Ventas cerradas</h3></div>
        ${conAmbos.length?`
        <div class="grid stat-grid" style="margin-bottom:14px">
          <div class="card stat"><div class="lbl">Se publicó por</div><div class="val" style="font-size:22px">${u(publicadoUSD)}</div><div class="sub">${conAmbos.length} ${conAmbos.length===1?'operación':'operaciones'}</div></div>
          <div class="card stat"><div class="lbl">Se cerró por</div><div class="val" style="font-size:22px">${u(cerradoUSD)}</div><div class="sub">precio real de venta</div></div>
          <div class="card stat"><div class="lbl">Diferencia</div>
            <div class="val" style="font-size:22px;color:${difPct<0?'var(--red)':(difPct>0?'var(--green)':'var(--ink)')}">${difPct>0?'+':''}${difPct}%</div>
            <div class="sub">${difPct<0?'se negocia a la baja':(difPct>0?'se cierra por encima':'cierra al precio publicado')}</div></div>
          <div class="card stat"><div class="lbl">Comisión promedio</div><div class="val" style="font-size:22px">${vendidas.length?(vendidas.reduce((s,p)=>s+(p.comision||0),0)/vendidas.length).toFixed(1).replace(/\\.0$/,""):"—"}%</div><div class="sub">sobre las ventas cerradas</div></div>
        </div>`:""}
        <div class="table-wrap"><table>
          <thead><tr><th>Propiedad</th><th>Fecha</th><th>Publicado</th><th>Vendido</th><th>Dif.</th><th>Comisión</th><th>Días</th></tr></thead>
          <tbody>
            ${vendidas.slice().sort((a,b)=>String(b.fechaVenta||"").localeCompare(String(a.fechaVenta||""))).map(p=>{
              const mReal = p.monedaVentaReal||p.monedaVenta;
              const tuvo = p.precioVenta!=null && p.precioPublicado!=null && p.precioPublicado>0 && (p.monedaPublicada||p.monedaVenta)===mReal;
              const d = tuvo ? p.precioVenta-p.precioPublicado : null;
              const dp = tuvo && p.precioPublicado ? Math.round(d*100/p.precioPublicado) : null;
              const dias = (p.fechaPub&&p.fechaVenta)?daysBetween(p.fechaPub,p.fechaVenta):null;
              return `<tr>
                <td><div class="t-strong">${esc(p.titulo)}</div><div class="t-muted">${esc(p.barrio||p.localidad||"")}${p.comprador?` · ${esc(p.comprador)}`:""}</div></td>
                <td>${fdate(p.fechaVenta)}</td>
                <td class="t-muted">${p.precioPublicado!=null?fmt(p.precioPublicado,p.monedaPublicada||p.monedaVenta):"—"}</td>
                <td class="t-strong">${p.precioVenta!=null?fmt(p.precioVenta,mReal):fmt(p.valorVenta,p.monedaVenta)}</td>
                <td>${dp!=null?`<span class="badge ${dp<0?'red':(dp>0?'green':'gray')}">${dp>0?'+':''}${dp}%</span>`:'<span class="t-muted">—</span>'}</td>
                <td>${p.comisionMonto!=null?`${fmt(p.comisionMonto,mReal)}<div class="t-muted">${p.comision||0}%</div>`:(p.comision?p.comision+"%":"—")}</td>
                <td>${dias!=null?dias:"—"}</td>
              </tr>`;
            }).join("")}
          </tbody>
        </table></div>
      </div>`:""}

      <!-- REQUIERE ATENCIÓN -->
      ${(estancadas.length||sinInteres.length)?`
      <div class="section">
        <div class="section-head"><h3>Requiere decisión</h3></div>
        <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px">
          ${estancadas.length?`
          <div class="card" style="padding:16px">
            <div class="t-strong" style="margin-bottom:4px;color:var(--red)">${estancadas.length} ${estancadas.length===1?'propiedad estancada':'propiedades estancadas'}</div>
            <div class="t-muted" style="font-size:12.5px;margin-bottom:12px">Más de 120 días publicadas. Puede requerir revisión de precio o hablar con el propietario.</div>
            ${estancadas.slice(0,6).map(p=>`
              <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line)">
                <div><div class="t-strong" style="font-size:13px">${esc(p.titulo)}</div>
                  <div class="t-muted" style="font-size:12px">${esc(p.barrio||p.localidad||"—")} · ${fmt(p.valorVenta,p.monedaVenta)}</div></div>
                <div style="text-align:right"><span class="badge red">${diasEnCartera(p)} días</span></div>
              </div>`).join("")}
          </div>`:""}
          ${sinInteres.length?`
          <div class="card" style="padding:16px">
            <div class="t-strong" style="margin-bottom:4px;color:#b7791f">${sinInteres.length} sin interesados</div>
            <div class="t-muted" style="font-size:12.5px;margin-bottom:12px">Publicadas pero sin ninguna consulta registrada. ¿Falta difusión o el precio está alto?</div>
            ${sinInteres.slice(0,6).map(p=>`
              <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line)">
                <div><div class="t-strong" style="font-size:13px">${esc(p.titulo)}</div>
                  <div class="t-muted" style="font-size:12px">${esc(p.barrio||p.localidad||"—")}</div></div>
                <div class="t-muted" style="font-size:12px">${fmt(p.valorVenta,p.monedaVenta)}</div>
              </div>`).join("")}
          </div>`:""}
        </div>
      </div>`:""}

      <!-- COMPOSICIÓN -->
      <div class="section">
        <div class="section-head"><h3>Composición de la cartera</h3></div>
        <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px">
          <div class="card" style="padding:16px">
            <div class="t-strong" style="margin-bottom:12px">Por barrio</div>
            ${barra(porBarrio, disponibles.length)}
          </div>
          <div class="card" style="padding:16px">
            <div class="t-strong" style="margin-bottom:12px">Por tipo de propiedad</div>
            ${barra(porTipo, disponibles.length)}
          </div>
          <div class="card" style="padding:16px">
            <div class="t-strong" style="margin-bottom:12px">Embudo de interesados</div>
            ${leadsActivos.length?embudo.map(([e,n])=>{
              const pct = leadsActivos.length?Math.round(n*100/leadsActivos.length):0;
              return `<div style="margin-bottom:10px">
                <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
                  <span class="t-strong">${e}</span><span class="t-muted">${n}</span></div>
                <div style="height:7px;background:var(--line);border-radius:4px;overflow:hidden">
                  <div style="height:100%;width:${pct}%;background:var(--brand);border-radius:4px"></div></div>
              </div>`;
            }).join(""):`<div class="t-muted" style="font-size:13px">Sin interesados cargados.</div>`}
          </div>
        </div>
      </div>

      <!-- REPORTE POR CAPTADOR / VENDEDOR -->
      ${(rankCaptadores.length || rankVendedores.length)?`
      <div class="section">
        <div class="section-head"><h3>Desempeño del equipo</h3></div>
        <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px">
          <div class="card" style="padding:16px">
            <div class="t-strong" style="margin-bottom:12px">Propiedades por captador</div>
            ${rankCaptadores.length?`
            <div class="table-wrap"><table>
              <thead><tr><th>Captador</th><th style="text-align:center">Captadas</th><th style="text-align:center">Vendidas</th><th style="text-align:center">Efectividad</th></tr></thead>
              <tbody>
                ${rankCaptadores.map(c=>{
                  const ef = c.captadas ? Math.round(c.vendidas*100/c.captadas) : 0;
                  return `<tr>
                    <td class="t-strong">${esc(c.nombre)}</td>
                    <td style="text-align:center">${c.captadas}</td>
                    <td style="text-align:center">${c.vendidas}</td>
                    <td style="text-align:center"><span class="badge ${ef>=50?'green':(ef>0?'amber':'gray')}">${ef}%</span></td>
                  </tr>`;
                }).join("")}
                ${sinCaptador?`<tr><td class="t-muted">Sin captador cargado</td><td style="text-align:center" class="t-muted">${sinCaptador}</td><td style="text-align:center" class="t-muted">—</td><td></td></tr>`:""}
              </tbody>
            </table></div>`:`<div class="t-muted" style="font-size:13px">Todavía no hay captadores cargados en las propiedades.</div>`}
          </div>
          <div class="card" style="padding:16px">
            <div class="t-strong" style="margin-bottom:12px">Ventas por vendedor</div>
            ${rankVendedores.length?`
            <div class="table-wrap"><table>
              <thead><tr><th>Vendedor</th><th style="text-align:center">Ventas</th><th style="text-align:right">Comisión generada</th></tr></thead>
              <tbody>
                ${rankVendedores.map(vd=>`<tr>
                  <td class="t-strong">${esc(vd.nombre)}</td>
                  <td style="text-align:center">${vd.vendidas}</td>
                  <td style="text-align:right">${u(vd.comision)}</td>
                </tr>`).join("")}
              </tbody>
            </table></div>`:`<div class="t-muted" style="font-size:13px">Todavía no hay ventas con vendedor cargado.</div>`}
          </div>
        </div>
      </div>`:""}

      <!-- COTIZACIÓN -->
      <div class="card" style="margin-top:18px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:12px">
          <div style="color:var(--brand)">${I.money}</div>
          <div>
            <div class="t-strong">Dólar de referencia: USD 1 = $${(DB.cotizacion||1000).toLocaleString('es-AR')}</div>
            <div class="t-muted" style="font-size:12.5px">
              ${DB.cotizacionFecha
                ? `Actualizado el ${fdate(DB.cotizacionFecha)}${Cotiz.desactualizada()?` · <span style="color:var(--red);font-weight:600">conviene revisarlo</span>`:""}`
                : `<span style="color:var(--red);font-weight:600">Sin actualizar</span> · es el valor inicial, conviene cargar el real`}
              · Los montos de arriba se calculan con este valor.
            </div>
          </div>
        </div>
        ${can()?`<button class="btn btn-primary btn-sm" onclick="Cotiz.form()">${I.edit} Actualizar cotización</button>`:""}
      </div>
    `;
  },

  alarmRow(a){
    return `<div class="alarm">
      <div class="alarm-ic ${a.level}">${a.icon}</div>
      <div class="alarm-body"><div class="t">${a.title}</div><div class="d">${a.desc}</div>
        ${(a.action && can())?`<button class="btn btn-sm btn-primary" style="margin-top:8px" onclick="${a.action}">${I.check} ${a.actionLabel||"Registrar realizado"}</button>`:""}
      </div>
      <div class="alarm-time">${a.when}</div>
    </div>`;
  },

  /* ---------- MAESTRO DE PROPIEDADES ---------- */
  render_properties(){
    const all = DB.properties;
    const rows = Filtros.aplicar('properties', all);
    return `
      <div class="page-head">
        <div><h2>Maestro de propiedades</h2><p>Base única de propiedades en venta.</p></div>
        <button class="btn btn-primary" onclick="Prop.form()">${I.plus} Nueva propiedad</button>
      </div>
      ${all.length ? Filtros.panel('properties', all) : ""}
      ${all.length ? `${Filtros.contador(rows.length, all.length)}
      <div class="table-wrap" style="margin-top:10px"><table>
        <thead><tr><th>Código</th><th>Propiedad</th><th>Tipo</th><th>Sup. / Dorm.</th><th>Valor</th><th>Estado</th><th>Drive</th><th>Visible col.</th><th></th></tr></thead>
        <tbody>
          ${rows.length ? rows.map(p=>`
            <tr class="${esVendida(p)?'sold':''}">
              <td><span class="code-tag">${esc(p.codigo||"—")}</span></td>

  /* ---------- VENTAS ---------- */
  render_sales(){
    const isViewer = STATE.role==="viewer";
    let base = DB.properties.filter(p=>p.enVenta);
    if (isViewer) base = base.filter(p=>p.visibleColegas);
    const ventas = Filtros.aplicar('sales', base);
    const head = `
      <div class="page-head">
        <div><h2>Ventas</h2><p>${isViewer?"Propiedades disponibles para ofrecer. Solo lectura.":"Propiedades en venta, valores e interesados."}</p></div>
        ${(!isViewer && can())?`<button class="btn btn-primary" onclick="Prop.form(null,'venta')">${I.plus} Nueva propiedad en venta</button>`:""}
      </div>`;
    const notice = isViewer?`<div class="notice">${I.eye}<div>Vista <b>Visor (colega)</b>: solo lectura, solo propiedades habilitadas, sin propietario, comisión ni interesados. <b>Podés filtrar por rango de precio</b> para encontrar propiedades dentro de un presupuesto, aunque el precio exacto no se muestre.</div></div>`:"";
    if (!base.length) return head+notice+App.emptyState("Sin propiedades en venta", isViewer?"No hay propiedades habilitadas para mostrar.":"Marcá una propiedad como 'en venta'.", (isViewer||!can())?null:"Nueva propiedad", "Prop.form(null,'venta')");
    const panel = Filtros.panel('sales', base);
    const contador = Filtros.contador(ventas.length, base.length);
    if (!ventas.length) return head+notice+panel+`<div class="card"><div class="empty"><div class="ic">${I.search}</div><h4>Sin resultados</h4><p>Ninguna propiedad coincide con los filtros.</p><button class="btn btn-primary" onclick="Filtros.limpiar('sales')">Limpiar filtros</button></div></div>`;
    return head+notice+panel+contador+`
      <div class="table-wrap" style="margin-top:10px"><table>
        <thead><tr>${isViewer?"":"<th>Código</th>"}<th>Propiedad</th><th>Tipo / Dorm.</th><th>Valor</th>
          ${isViewer?"":"<th>Propietario</th><th>Comisión</th><th>Estado</th><th>Interesados</th><th>Publicada</th>"}
          <th>Financiación</th><th>Drive</th><th></th></tr></thead>
        <tbody>
          ${ventas.map(p=>{
            const leads = DB.leads.filter(l=>l.propId===p.id);
            const ant = p.fechaPub?daysBetween(p.fechaPub,today):null;
            const vc = k => !isViewer || App.visorVe(p,k); // admin ve todo; visor según config
            const finBadges = vc('financiacion') ? `${p.aptaCredito?'<span class="badge blue" style="margin-right:4px">Apta crédito</span>':''}${p.aceptaFinanciacion?'<span class="badge green">Financia</span>':''}${(!p.aptaCredito&&!p.aceptaFinanciacion)?'<span class="t-muted">—</span>':''}` : '<span class="t-muted">—</span>';
            const ubic = isViewer
              ? (p.barrio ? `B° ${esc(p.barrio)} — ${esc(p.localidad||"")}` : esc(p.localidad||"—"))
              : (p.barrio ? `${esc(p.direccion)} · B° ${esc(p.barrio)}` : esc(p.direccion));
            const comMonto = (p.comision && p.valorVenta) ? fmt(Math.round(p.valorVenta*p.comision/100), p.monedaVenta) : null;
            const tipoDorm = `${esc(p.tipo)}${isVivienda(p.tipo)?`<div class="t-muted">${p.dorm||0} dorm.${(p.cochera&&p.cochera!=="No tiene")?" · cochera":""}${p.patio?" · patio":""}</div>`:""}`;
            return `<tr class="${esVendida(p)?'sold':''}">
              ${isViewer?"":`<td><span class="code-tag">${esc(p.codigo||"—")}</span></td>`}
              <td><div class="t-strong">${esc(p.titulo)}</div><div class="t-muted">${ubic}</div></td>
              <td>${tipoDorm}</td>
              <td class="t-strong">${vc('valor')
                ? (esVendida(p)&&p.precioVenta!=null
                    ? `${fmt(p.precioVenta,p.monedaVentaReal||p.monedaVenta)}<div class="t-muted" style="font-weight:400">vendida</div>`
                    : fmt(p.valorVenta,p.monedaVenta))
                : '<span class="t-muted">A consultar</span>'}</td>
              ${isViewer?"":`
                <td>${esc(p.propietario||"—")}${p.telPropietario?`<div class="t-muted">${esc(p.telPropietario)}</div>`:""}</td>
                <td>${p.comision?p.comision+"%":"—"}${comMonto?`<div class="t-muted">${comMonto}</div>`:""}</td>
                <td>${esVendida(p)?'<span class="badge red"><span class="dot"></span>Vendida</span>':App.opBadge(p.estadoOp)}</td>
                <td><button class="btn btn-sm" onclick="Lead.list(${p.id})">${leads.length} ${leads.length===1?'interesado':'interesados'}</button></td>
                <td>${ant!=null?ant+" días":"—"}</td>`}
              <td>${finBadges}</td>
              <td><a class="drive-link" href="${esc(p.drive)}" target="_blank">${I.drive} ${isViewer?'Ver carpeta':'Abrir'}</a></td>
              <td><div class="row-actions">
                <button class="icon-btn" title="Ver" onclick="Prop.view(${p.id})">${I.eye}</button>
                ${(!isViewer&&can()&&!esVendida(p))?`<button class="icon-btn" title="Marcar como vendida" onclick="Prop.marcarVendida(${p.id})">${I.check}</button>`:""}
                ${canDelete()?`<button class="icon-btn" title="Eliminar" onclick="Prop.eliminar(${p.id})">${I.trash}</button>`:""}
              </div></td>
            </tr>`;
          }).join("")}
        </tbody>
      </table></div>`;
  },

  /* ---------- ALARMAS ---------- */
  render_alarms(){
    const alarms = computeAlarms();
    return `
      <div class="page-head"><div><h2>Alarmas y seguimientos</h2><p>Agenda de contactos con interesados. <b>Aparecen todos los seguimientos agendados</b>, ordenados por fecha, y quedan activos hasta marcarse como realizados.</p></div></div>
      <div class="card">

      <div class="page-head"><div><h2>Usuarios y permisos</h2><p>Perfiles de acceso al sistema.</p></div></div>

        <tbody>
          <tr><td class="t-strong">Gerencia</td><td><span class="badge blue">Acceso total</span></td><td>Todos los módulos y datos</td><td>Ver, editar y eliminar</td><td><span class="badge green"><span class="dot"></span>Activo</span></td></tr>
          <tr><td class="t-strong">Ventas1</td><td><span class="badge blue">Acceso total</span></td><td>Todos los módulos y datos</td><td>Ver, editar y eliminar</td><td><span class="badge green"><span class="dot"></span>Activo</span></td></tr>
          <tr><td class="t-strong">Ventas2</td><td><span class="badge blue">Acceso total</span></td><td>Todos los módulos y datos</td><td>Ver, editar y eliminar</td><td><span class="badge green"><span class="dot"></span>Activo</span></td></tr>
          <tr><td class="t-strong">Ventas3</td><td><span class="badge blue">Acceso total</span></td><td>Todos los módulos y datos</td><td>Ver, editar y eliminar</td><td><span class="badge green"><span class="dot"></span>Activo</span></td></tr>
          <tr><td class="t-strong">Colegas</td><td><span class="badge gray">Visor</span></td><td>Solo Ventas · propiedades habilitadas</td><td>Solo lectura (filtra por precio sin verlo)</td><td><span class="badge green"><span class="dot"></span>Activo</span></td></tr>
        </tbody>
      </table></div>
      <div class="notice" style="margin-top:20px">${I.info}<div>Las cuentas y sus contraseñas se crean en la consola de Firebase (Authentication). El rol de cada persona se define en la colección <b>usuarios</b> y determina a qué módulos accede. Para agregar o dar de baja a alguien, se hace desde Firebase, no desde acá.</div></div>
    `;

  visorVe(p,k){ const vc=p.visorCampos; return vc==null ? true : !!vc[k]; },
};
